name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Python syntax
        run: python -m py_compile PC_Hub/Monitoring_Hub.py PC_Hub/test_hub.py
      - name: Run isolated hub tests
        run: python -m unittest discover -s PC_Hub -p 'test_*.py' -v
      - name: Check dashboard JavaScript
        run: node scripts/check-dashboard.cjs
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and ArduinoJson
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install ArduinoJson@7.4.3
      - name: Compile firmware with example credentials
        run: |
          cp ESP32_Station/secrets.example.h ESP32_Station/secrets.h
          arduino-cli compile --fqbn esp32:esp32:esp32cam ESP32_Station
