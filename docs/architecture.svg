<g font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#536656"><text x="345" y="219">HTTPS</text><text x="801" y="219">HTTPS</text></g>
<path d="M167 365V413" fill="none" stroke="#8b9b8e" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="32" y="424" width="1136" height="84" rx="12" fill="#eef1e8" stroke="#bac9b7" stroke-dasharray="6 4"/>
<g font-family="Arial,sans-serif" fill="#375442"><text x="52" y="453" font-size="17" font-weight="bold">Original local PC hub · separate optional path</text><text x="52" y="480" font-size="15">Local HTTP controls only · Python / SQLite · Cloud uploads do not require the PC</text><text x="32" y="550" font-size="15" font-weight="bold">22 October 2026 checkpoint: Plant 2 reported sleep on; capture reliability remained unverified.</text><text x="32" y="578" font-size="14" fill="#536656">Plants 1 and 3 rollout, full physical sleep/wake, and a fresh-photo analysis cycle remain pending.</text></g>
