<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Rice Plant Monitoring: cloud and local architecture</title>
<desc id="desc">Protected cloud firmware retains microSD originals and sends new photos over verified HTTPS to a DigitalOcean cloud service. A password-protected public HTTPS dashboard queues commands for the next device sync or wake. The original local HTTP hub remains optional and has different SD protection behavior. Last verified on 22 October 2026: analysis enabled for new uploads, Plant 2 reported sleep enabled but capture reliability and a full sleep-wake cycle remained unverified. Plants 1 and 3 cloud rollout was pending.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#397052"/></marker></defs>
<rect width="1200" height="610" rx="20" fill="#f6f7f1"/>
<g font-family="Arial,sans-serif" fill="#183d2d"><text x="32" y="45" font-size="27" font-weight="bold">Rice Plant Monitoring</text><text x="32" y="74" font-size="16" fill="#536656">Direct cloud uploads · SD originals retained · Sleep selected by the user</text></g>
<g fill="#fff" stroke="#b6cdbb" stroke-width="2"><rect x="32" y="120" width="270" height="244" rx="14"/><rect x="388" y="120" width="370" height="244" rx="14"/><rect x="844" y="120" width="324" height="244" rx="14"/></g>
<g font-family="Arial,sans-serif" fill="#183d2d">
<text x="52" y="155" font-size="19" font-weight="bold">ESP32-CAM stations</text><text x="52" y="190" font-size="15">Camera + microSD originals</text><text x="52" y="220" font-size="15">Scheduled / manual captures</text><text x="52" y="250" font-size="15">New JPEG upload queue</text><text x="52" y="280" font-size="15">Retries keep originals on SD</text><text x="52" y="322" font-size="14" fill="#536656">Deep sleep is optional</text>
<text x="408" y="155" font-size="19" font-weight="bold">DigitalOcean cloud service</text><text x="408" y="190" font-size="15">HTTPS device sync + JPEG uploads</text><text x="408" y="220" font-size="15">SQLite metadata + photo storage</text><text x="408" y="250" font-size="15">Durable commands + checksums</text><text x="408" y="280" font-size="15">Separate service and storage</text><text x="408" y="322" font-size="14" fill="#536656">Analysis enabled for new uploads</text>
<text x="864" y="155" font-size="19" font-weight="bold">Public HTTPS dashboard</text><text x="864" y="190" font-size="15">Password sessions + CSRF protection</text><text x="864" y="220" font-size="15">Full-frame gallery + history</text><text x="864" y="250" font-size="15">Capture / schedule / awake controls</text><text x="864" y="280" font-size="15">Commands queued for next sync</text><text x="864" y="322" font-size="14" fill="#536656">Sleeping device checks at next wake</text>
</g>
