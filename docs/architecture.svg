<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Rice Plant Monitoring architecture</title><desc id="desc">Three camera stations retain photos on SD cards and synchronize over local Wi-Fi to a PC hub with durable storage and a browser dashboard. Optional analysis runs on the PC.</desc>
<rect width="1000" height="300" rx="20" fill="#f2f6f2"/>
<g font-family="Arial,sans-serif" fill="#183d2d"><text x="32" y="42" font-size="24" font-weight="bold">Rice Plant Monitoring</text><text x="32" y="67" font-size="14">Camera recording continues while the PC is off</text></g>
<g fill="white" stroke="#b6cdbb" stroke-width="2"><rect x="32" y="105" width="215" height="145" rx="14"/><rect x="355" y="105" width="285" height="145" rx="14"/><rect x="750" y="105" width="218" height="145" rx="14"/></g>
<g font-family="Arial,sans-serif" fill="#183d2d" font-size="16"><text x="50" y="135" font-weight="bold">3 ESP32-CAM stations</text><text x="50" y="166">Hourly + manual photos</text><text x="50" y="191">Local microSD originals</text><text x="50" y="220">Unique station identities</text><text x="375" y="135" font-weight="bold">PC monitoring hub</text><text x="375" y="166">SQLite queue + photo files</text><text x="375" y="191">Backups + JSON sidecars</text><text x="375" y="220">Optional image analysis</text><text x="770" y="135" font-weight="bold">LAN dashboard</text><text x="770" y="166">Gallery + capture controls</text><text x="770" y="191">Status + analysis history</text><text x="770" y="220">Visible while hub runs</text></g>
<g stroke="#28734e" stroke-width="3"><path d="M250 180H347m-10-7 10 7-10 7" fill="none"/><path d="M645 180H741m-10-7 10 7-10 7" fill="none"/></g><g font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#466652"><text x="300" y="149">Wi-Fi / HTTP</text><text x="300" y="208">UDP discovery</text><text x="695" y="149">Local HTTP</text></g>
</svg>
